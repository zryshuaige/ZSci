[project]
name = "zsci-backend"
version = "0.1.0"
description = "Z-Sci local research agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "litellm>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
]

# Use the Tsinghua PyPI mirror as the default index. Direct PyPI access is
# heavily throttled in some regions (e.g. mainland China); this mirror mirrors
# all of PyPI and is far faster there. Remove this block to use the default
# index (PyPI) elsewhere.
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's
# idiomatic pattern; suppressing keeps the lint useful for non-FastAPI code.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
