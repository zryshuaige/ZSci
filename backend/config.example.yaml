# Z-Sci model-gateway configuration (design.md §4.4)
#
# Copy this to workspace/.research-agent/config.yaml and edit.
# API keys are NEVER read from this file. Each provider references an env var
# that you set in backend/.env (or your shell), e.g.:
#   OPENAI_API_KEY=sk-...
#   DEEPSEEK_API_KEY=sk-...
#   ANTHROPIC_API_KEY=sk-ant-...
#   GEMINI_API_KEY=...
#   DASHSCOPE_API_KEY=...        # 通义千问
#   ZHIPUAI_API_KEY=...          # 智谱
#   SILICONFLOW_API_KEY=sk-...   # 硅基流动 (GLM-4.7 等)
#
# `provider` is a litellm provider key. Common values:
#   openai, anthropic, gemini, deepseek, qwen, zhipu, ollama
# For local OpenAI-compatible servers (vLLM / LM Studio / Ollama openai mode),
# use provider: openai with a base_url pointing at your server.

models:
  # --- Default chat model used for translation + reading-note generation ---
  # Uncomment ONE of the blocks below (or add your own). DeepSeek is a cheap
  # default; OpenAI is the most broadly compatible.

  default_chat:
    provider: deepseek
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY

